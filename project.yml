name: PitchNotesIOS
options:
  bundleIdPrefix: com.thesagezm
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  OnnxRuntime:
    # Mirror of microsoft/onnxruntime-swift-package-manager (pulled from GitHub
    # 2026-11-17) — the ONE inference runtime (D-13, AGENTS §6). Tag 1.24.2 =
    # rev 837832e (re-pointed per D-18.2 precedent: 7dbd851 re-host @D-18.2 →
    # 837832e X-014 fix 2026-11-22 — ObjC wrapper gains the Double element-type
    # mapping; SwiftF0 pitch output is tensor(double). Pod archives UNTOUCHED —
    # SHA256-identical to the pre-takedown manifest — f7100a99…00b54 /
    # 346522d1…6b5; the objectivec wrapper builds from source). The iOS slice is a STATIC ar
    # archive, so the app binary must carry no @rpath framework load commands
    # (LiveContainer requirement — enforced by the build-ipa verify step).
    url: https://github.com/thesagezm/onnxruntime-swift-package-manager
    exactVersion: "1.24.2"
  PitchLogic:
    # Pure-Swift logic core (scoring, note-track parsing, schema validation).
    # Package lives at Tests/Logic/ per the AGENTS §12 file map; the app links
    # it statically so UI and CI share one implementation.
    path: Tests/Logic
  EngineCore:
    # Paul's engine core (P-001): C-1/C-2/C-3 contract types + V1–V13 validators +
    # EngineAPI + MockEngine. Foundation-only, no ORT — real model engines arrive
    # in M1+ behind the same package. Static linkage (no type: .dynamic); the
    # build-ipa patch/verify steps guard this.
    path: Engine
  PitchORT:
    # Paul's Apple-only ORT seam (P-101; wired per X-008/X-013, run 44981256783
    # green): OnnxSwiftF0Inference + SwiftF0ModelStore over the SAME OnnxRuntime
    # mirror pin (D-13 tag 1.24.2) and EngineCore. Sits outside EngineCore so the
    # portable core stays Linux-clean (ORT ObjC bindings are Apple-only). Pure
    # Swift over the STATIC ORT ar archive — no new @rpath surface (build-ipa
    # verify step guards).
    path: Engine/PitchORT
  MicCapture:
    # Paul's Apple-only mic-capture wrapper (P-104; wired per X-011/X-013, 7 smoke
    # tests green run 44981256783): AVAudioEngine input tap → AVAudioConverter
    # (16 kHz) → EngineCore CapturePipeline. No new remote deps (path-dep on
    # Engine only); static by default. Mic permission string already in the
    # Info.plist above.
    path: Engine/MicCapture
  ImportKit:
    # Paul's Apple-only import kit (P-204; package boundary answered in
    # Docs/ENGINE.md v1.4 — EXTEND Engine/ImportKit, product name `ImportKit`,
    # NO new package, NO identity surprise). Carries the AVFoundation side of
    # the M2 import: ALACStemWriter + AVAudioFileDecoder + SongBundleImportEngine
    # (the C-9 whole-import entry point, D-36). NEEDS AVFoundation ⇒ it can
    # NOT live in the portable EngineCore. Wired into the app target by gate
    # step 5(a) (X-209) — AFTER paul→main landed the package on main, because
    # an SPM path-dependency on a missing directory hard-fails resolution
    # (that was the X-201-r1 red).
    path: Engine/ImportKit
targets:
  PitchNotesIOS:
    type: application
    platform: iOS
    sources:
      - App/Sources
      # M2 GATE STEP 5(b) (X-207): the model registry travels INTO the app
      # bundle, so the app can resolve a model's URL + SHA256 + size offline
      # (J-207's runtime download verifies against these bytes). The manifest
      # that lands here carries the `htdemucs` entry (Paul, D-32.6) — main's
      # pre-paul merge manifest had NO htdemucs entry, so the downloader could
      # never match it. Wired only AFTER paul→main landed that manifest
      # (session-8 Finding 3).
      - path: Models/manifest.json
      # M2 GATE STEP 5 (M2 gate merge #11 @9909415): the DemucsEngine bridge +
      # vendored demucs.cpp are on MAIN now, so these entries are NO LONGER
      # optional — a missing bridge file must FAIL LOUDLY instead of silently
      # producing an app with no separation engine (the X-201 branch-state
      # adapter in build.yml, which stripped these entries when the files were
      # absent, is REMOVED in the same commit — it is now a permanent no-op).
      - path: Engine/Separation/DemucsEngine.swift
      - path: Engine/Separation/DemucsShim.cpp
      - path: vendor/demucs.cpp/src/crosstransformer.cpp
      - path: vendor/demucs.cpp/src/dsp.cpp
      - path: vendor/demucs.cpp/src/encdec.cpp
      - path: vendor/demucs.cpp/src/layers.cpp
      - path: vendor/demucs.cpp/src/lstm.cpp
      - path: vendor/demucs.cpp/src/model_apply.cpp
      - path: vendor/demucs.cpp/src/model_inference.cpp
      - path: vendor/demucs.cpp/src/model_load.cpp
    dependencies:
      - package: OnnxRuntime
        product: onnxruntime
      - package: PitchLogic
      - package: EngineCore
        product: EngineCore
      - package: PitchORT
        product: PitchORT
      - package: MicCapture
        product: MicCapture
      # M2 GATE STEP 5(a) (X-209): the real import engine enters the app
      # target. ImportKit is a local path-package (Paul's declared boundary —
      # EXTEND Engine/ImportKit, product `ImportKit`), so there is no new
      # remote dependency and no identity surprise. The `SEPARATION_IMPORT_ENGINE`
      # compilation condition that OPENS Jess's real-engine binding is NOT set
      # here — it is gate step 5(c), its own commit, fired only after Jess's
      # binding is on main (D-36 §7).
      - package: ImportKit
        product: ImportKit
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: PitchNotes
        # Literal version in the GENERATED plist (speechnotes precedent: without
        # these keys iOS reported 1.0). Keep MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION below in sync on every bump.
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Only runtime permission: live pitch matching. No network entitlements
        # (100% offline at runtime; models download once, AGENTS §0/§11).
        NSMicrophoneUsageDescription: "PitchNotes listens to your singing to show live pitch feedback and grade your takes. Audio is processed on this device only and never leaves your iPhone."
        ITSAppUsesNonExemptEncryption: false
        # M2 GATE STEP 5: the Files-container fallback for the separation
        # weights (J-207) — the user can drop the 84 MB htdemucs file into the
        # app's Documents folder over USB/Finder and the app adopts it after
        # verifying its SHA256 against the bundled manifest. Both keys are
        # required together: UIFileSharingEnabled exposes Documents in Files;
        # LSSupportsOpeningDocumentsInPlace lets the app open what is already
        # there without copying it out of the container.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Stem playback continues with the screen locked (J-203 mixer). Exactly
        # [audio] — the build-ipa verify step guards against drift in both
        # directions (speechnotes precedent).
        UIBackgroundModes:
          - audio
        # Import sources for the document picker (M2). LSHandlerRank Alternate:
        # we open these files, we are not their default player.
        CFBundleDocumentTypes:
          - CFBundleTypeName: MP3 audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.mp3]
          - CFBundleTypeName: FLAC audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.xiph.flac]
          - CFBundleTypeName: WAV audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.microsoft.waveform-audio]
          - CFBundleTypeName: M4A audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.mpeg-4-audio]
          # M3 (D-47 §1): the MusicXML score import (J-304). LSHandlerRank
          # Alternate — we OPEN and display scores, we are not the device's
          # primary MusicXML app (Owner would fight other score apps for the
          # type). `public.xml` is listed as an EXTRA content type because many
          # MusicXML files use the .xml extension and .xml belongs to the
          # system (public.xml) — we IMPORT that system type, we never claim
          # its extension.
          - CFBundleTypeName: MusicXML Score
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.recordare.musicxml
              - com.recordare.musicxml.compressed
              - public.xml
        # The two MusicXML UTIs are NOT system-declared — PROVED on a macOS
        # runner (D-47 §1, probe run 45575220286): `UTType("com.recordare.musicxml")`
        # and `UTType("com.recordare.musicxml.compressed")` are both NIL, while
        # `UTType(filenameExtension:"musicxml")` returns a DYNAMIC placeholder
        # (the OS synthesises one for an extension no declaration claims). So
        # the app must DEFINE the types or the document picker cannot filter
        # them. (`public.xml` / `public.zip-archive` ARE system-declared, and we
        # conform to them — we never export them.)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.recordare.musicxml
            UTTypeDescription: MusicXML Score
            UTTypeConformsTo:
              - public.xml
              - public.text
              - public.data
            UTTypeTagSpecification:
              # `musicxml` ONLY — the `xml` extension belongs to public.xml and
              # claiming it would hijack every XML file on the device (D-47 §1b).
              public.filename-extension: [musicxml]
              public.mime-type: application/vnd.recordare.musicxml+xml
          - UTTypeIdentifier: com.recordare.musicxml.compressed
            UTTypeDescription: Compressed MusicXML Score
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              # .mxl IS a ZIP container, not XML — hence public.zip-archive.
              public.filename-extension: [mxl]
              public.mime-type: application/vnd.recordare.musicxml
    settings:
      base:
        PRODUCT_NAME: PitchNotes
        PRODUCT_BUNDLE_IDENTIFIER: com.thesagezm.pitchnotes
        # Keep CFBundleShortVersionString / CFBundleVersion in info.properties
        # above in sync — a release bump touches all three.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        # X-201: vendored demucs.cpp is C++17 (ZERO OpenMP pragmas, D-32.4 — do
        # NOT add -fopenmp); Eigen headers incl. unsupported/Eigen/CXX11/Tensor;
        # SWIFT_INCLUDE_PATHS resolves `import DemucsShim` via
        # Engine/Separation/module.modulemap (the bridge is on main since the
        # M2 gate merge #11 @9909415).
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Engine/Separation"
          - "$(SRCROOT)/vendor/demucs.cpp/src"
          - "$(SRCROOT)/vendor/demucs.cpp/third_party/eigen"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Engine/Separation"
        # M2 GATE STEP 5(c) (D-36 §7) — the compilation condition that OPENS
        # Jess's real-engine binding, and nothing else. The binding is guarded
        # by `#if canImport(ImportKit) && canImport(DemucsShim) &&
        # SEPARATION_IMPORT_ENGINE`; the first two are TRUE now that the
        # ImportKit package + the DemucsShim module map are wired, so this
        # condition is the LAST gate on the real path — the app compiles the
        # real separation import (DemucsEngine -> SongBundleImportEngine ->
        # importSong) instead of the mock.
        #
        # NO source path is added here (D-36 §7): the D-35 facade
        # (Engine/Separation/SeparationImportEngine.swift) does not exist and
        # is not needed — the real engine is Paula's SPM package `ImportKit`
        # and Jess's own app-side factory binds it.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SEPARATION_IMPORT_ENGINE"
schemes:
  PitchNotesIOS:
    build:
      targets:
        PitchNotesIOS: all
    run:
      config: Debug
    archive:
      config: Release
