name: PitchNotesIOS
options:
  bundleIdPrefix: com.thesagezm
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  OnnxRuntime:
    # Mirror of microsoft/onnxruntime-swift-package-manager (pulled from GitHub
    # 2026-11-17) — the ONE inference runtime (D-13, AGENTS §6). Tag 1.24.2 =
    # Tag 1.24.2 = rev 7dbd851 (D-18.2: Microsoft's takedown killed
    # download.onnxruntime.ai; the pod archives are re-hosted as release
    # 1.24.2-binaries ON this mirror repo, SHA256-identical to the pre-takedown
    # manifest — f7100a99…00b54 / 346522d1…6b5). The iOS slice is a STATIC ar
    # archive, so the app binary must carry no @rpath framework load commands
    # (LiveContainer requirement — enforced by the build-ipa verify step).
    url: https://github.com/thesagezm/onnxruntime-swift-package-manager
    exactVersion: "1.24.2"
  PitchLogic:
    # Pure-Swift logic core (scoring, note-track parsing, schema validation).
    # Package lives at Tests/Logic/ per the AGENTS §12 file map; the app links
    # it statically so UI and CI share one implementation.
    path: Tests/Logic
  EngineCore:
    # Paul's engine core (P-001): C-1/C-2/C-3 contract types + V1–V13 validators +
    # EngineAPI + MockEngine. Foundation-only, no ORT — real model engines arrive
    # in M1+ behind the same package. Static linkage (no type: .dynamic); the
    # build-ipa patch/verify steps guard this.
    path: Engine
  # X-008b/X-011a DEFERRED (Leto ruling at gate time, run 44957019830): Paul's
  # Apple-only seam packages Engine/PitchORT (ORT seam, 3 compile errors in
  # OnnxSwiftF0Inference.swift) and Engine/MicCapture (declares MicCaptureTests
  # with NO test sources committed → fatal "overlapping sources" at SPM
  # resolution) have never met a compiler — the X-008/X-011 wiring surfaced it.
  # They return HERE (packages + app deps, static) the moment X-013 lands:
  # PitchORT compiles green + MicCapture package resolves. CI proof runs
  # meanwhile as advisory steps in the logic-tests job (pitchort/miccapture
  # test logs + artifacts). Fix task: X-013 (owner: paul).
targets:
  PitchNotesIOS:
    type: application
    platform: iOS
    sources:
      - App/Sources
    dependencies:
      - package: OnnxRuntime
        product: onnxruntime
      - package: PitchLogic
      - package: EngineCore
        product: EngineCore
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: PitchNotes
        # Literal version in the GENERATED plist (speechnotes precedent: without
        # these keys iOS reported 1.0). Keep MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION below in sync on every bump.
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Only runtime permission: live pitch matching. No network entitlements
        # (100% offline at runtime; models download once, AGENTS §0/§11).
        NSMicrophoneUsageDescription: "PitchNotes listens to your singing to show live pitch feedback and grade your takes. Audio is processed on this device only and never leaves your iPhone."
        ITSAppUsesNonExemptEncryption: false
        # Stem playback continues with the screen locked (J-203 mixer). Exactly
        # [audio] — the build-ipa verify step guards against drift in both
        # directions (speechnotes precedent).
        UIBackgroundModes:
          - audio
        # Import sources for the document picker (M2). LSHandlerRank Alternate:
        # we open these files, we are not their default player.
        CFBundleDocumentTypes:
          - CFBundleTypeName: MP3 audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.mp3]
          - CFBundleTypeName: FLAC audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.xiph.flac]
          - CFBundleTypeName: WAV audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.microsoft.waveform-audio]
          - CFBundleTypeName: M4A audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.mpeg-4-audio]
    settings:
      base:
        PRODUCT_NAME: PitchNotes
        PRODUCT_BUNDLE_IDENTIFIER: com.thesagezm.pitchnotes
        # Keep CFBundleShortVersionString / CFBundleVersion in info.properties
        # above in sync — a release bump touches all three.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  PitchNotesIOS:
    build:
      targets:
        PitchNotesIOS: all
    run:
      config: Debug
    archive:
      config: Release
