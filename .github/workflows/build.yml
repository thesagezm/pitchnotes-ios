name: Build IPA

# Clone of thesagezm/speechnotes-ios .github/workflows/build.yml (AGENTS §6),
# renamed to PitchNotes and extended with the three-agent branch model:
# push to main/paul/jess/leto (path-filtered) + workflow_dispatch on any ref.
#
# M1 gate state (L-101 ACTIVATED): swiftf0/ribbon/silero spikes run the REAL
# pinned models and are BLOCKING (no continue-on-error); separation/basicpitch
# remain mock + allow-failure until their real runners land (M2/M3).

concurrency:
  # One run per branch: a push during an active build cancels the older run
  # (they'd both finish with the same result). Branch-level key keeps
  # main/paul/jess/leto runs parallel.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, paul, jess, leto]
    paths-ignore:
      - 'Docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  logic-tests:
    name: Logic tests (PitchLogic + model manifest)
    runs-on: macos-latest
    # X-203: 10 min killed the suite twice (45024720426, one prior) as the
    # M2 suites grew (EngineCore 112 + PitchLogic ~110 + MicCapture) — 15
    # gives headroom without masking hangs (Paul evidence two-for-two).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate model manifest schema (L-005)
        run: python3 -I scripts/models/download.py --manifest Models/manifest.json --validate-only

      # D-2 placeholder until the human creates thesagezm/pitchnotes-models.
      # test-blob: committed 1 KB, verified via file:// — raw.githubusercontent.com
      # 404s for private repos without auth (run 44840060323).
      - name: Verify committed test blob (file://, D-2 placeholder)
        run: |
          python3 -I scripts/models/download.py \
            --manifest Models/manifest.json \
            --entry test-blob \
            --url "file://${{ github.workspace }}/Models/test-blob.bin" \
            --cache-dir "$HOME/pitchnotes-model-cache"

      # Real HTTP + SHA256 over the network: immutable public file pinned by
      # commit SHA (public speechnotes-ios). Proves download.py's fetch/verify
      # path end-to-end until the public HF repo replaces the probes (D-2).
      - name: Download + SHA256-verify public http-probe
        run: |
          python3 -I scripts/models/download.py \
            --manifest Models/manifest.json \
            --entry http-probe \
            --cache-dir "$HOME/pitchnotes-model-cache"

      # D-19 interim rule (L-101): REAL model entries pinned to upstream
      # immutable URLs (HF revision / GitHub commit) + Leto-verified SHA256,
      # until thesagezm/pitchnotes-models exists (D-2, BLOCKED(human)).
      # Blocking here: proves the exact bytes the spikes will consume hash out
      # on every run, and warms the CI cache for the spike jobs.
      - name: Download + SHA256-verify swiftf0 (D-19 pinned upstream)
        run: |
          python3 -I scripts/models/download.py \
            --manifest Models/manifest.json \
            --entry swiftf0 \
            --cache-dir "$HOME/pitchnotes-model-cache"

      - name: Download + SHA256-verify silero-vad (D-19 pinned upstream)
        run: |
          python3 -I scripts/models/download.py \
            --manifest Models/manifest.json \
            --entry silero-vad \
            --cache-dir "$HOME/pitchnotes-model-cache"

      # X-008c (D-27.5, BLOCKING since X-013 landed — Paul's seam compiles and
      # the real-model tests pass green on run 44981256783): the tests locate
      # the cache the download steps above just filled ($HOME/pitchnotes-model-
      # cache, then <ws>/Models/downloads fallback); XCTSkip when no cached
      # model (local runs without the cache).
      - name: Run PitchORT package tests (real model via cache, X-008c BLOCKING)
        run: |
          set -o pipefail
          cd Engine/PitchORT
          swift test 2>&1 | tee ../pitchort-tests.log

      # X-011b (P-104, BLOCKING since X-013 landed — 7 smoke tests committed and
      # green on run 44981256783): config math + interruption-hook state
      # machine. NO mic needed, no capture started.
      - name: Run MicCapture package tests (X-011b BLOCKING)
        run: |
          set -o pipefail
          cd Engine/MicCapture
          swift test 2>&1 | tee ../miccapture-tests.log

      - name: Run PitchLogic package tests
        run: |
          set -o pipefail
          cd Tests/Logic
          swift test 2>&1 | tee ../../logic-tests.log

      # Paul's EngineCore (P-001): contract types + validators + MockEngine.
      # Foundation-only — compiles and tests on the macOS runner (first macOS
      # compile of this package happens here; Linux-verified until X-003 wiring).
      - name: Run EngineCore package tests
        run: |
          set -o pipefail
          cd Engine
          swift test 2>&1 | tee ../engine-tests.log

      - name: Upload engine test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-tests-log
          path: engine-tests.log
          if-no-files-found: warn

      - name: Upload PitchORT test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitchort-tests-log
          path: pitchort-tests.log
          if-no-files-found: warn

      - name: Upload MicCapture test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miccapture-tests-log
          path: miccapture-tests.log
          if-no-files-found: warn

      - name: Show failure summary
        if: failure()
        run: |
          grep -E "error:|failed|XCTAssert" logic-tests.log | tail -n 30 > summary.txt || true
          echo "----- LOGIC TEST FAILURE SUMMARY (last 30 matching lines) -----"
          cat summary.txt
          echo "-------------------------------------------------------------------"
          if [ -s summary.txt ]; then
            python3 -c "import pathlib; t = pathlib.Path('summary.txt').read_text()[:5500]; print('::error title=Logic tests failure::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          fi

      - name: Upload logic test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logic-tests-log
          path: logic-tests.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # SPIKE JOBS. M1 ACTIVATION (L-101, gate): swiftf0/ribbon/silero run the
  # REAL pinned models — venv carries numpy+onnxruntime, PITCHNOTES_SPIKE_REAL
  # =required makes the silent mock fallback a HARD failure (no mock at merge
  # time), and continue-on-error is REMOVED (blocking). separation/basicpitch
  # stay mock + allow-failure until their real runners land (M2/M3).
  # Job NAMES are final — merge gates reference these exact IDs (AGENTS §3/§6).
  # ---------------------------------------------------------------------
  swiftf0-spike:
    name: SwiftF0 spike (real pinned ONNX, L-101 BLOCKING)
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      PITCHNOTES_SPIKE_REAL: required
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Runner image python is 3.15 (run 44951410853 red) — onnxruntime ships
      # no cp315 wheels yet. Pin 3.13 for the ORT venv.
      - name: Set up Python 3.13 (onnxruntime wheels)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up harness deps (numpy + onnxruntime in venv — real-model mode)
        run: |
          python3 -m venv "$HOME/spike-venv"
          "$HOME/spike-venv/bin/pip" install --quiet numpy onnxruntime
      - name: Run spike harness (real D-19/D-20 pinned model, SHA-verified)
        run: '"$HOME/spike-venv/bin/python" Tests/Spikes/run_spike.py --spike swiftf0'

  # D-19 rename: nanopitch-spike -> ribbon-spike. The M1 gate spike tests the
  # D-17 ribbon default (vendored sevagh MPM/YIN, MIT — vendor/pitch-detection),
  # NOT NanoPitch (pretrained weights banned, GTSinger NC data). P-102 landed
  # the REAL C++ runner (Tests/Spikes/ribbon_real.py compiles vendor/ + kissfft
  # with clang++/g++ — present on macOS runners); X-009 flips the job line to
  # `--spike ribbon` and L-101 makes it BLOCKING (no mock fallback).
  ribbon-spike:
    name: "Causal ribbon spike (D-19 MPM/YIN real vendored runner, L-101 BLOCKING)"
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      PITCHNOTES_SPIKE_REAL: required
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The ribbon runner is the vendored C++ MPM/YIN (clang++, present on
      # macOS) — numpy only; NO onnxruntime dependency here (immune to the
      # runner-python wheel gap, run 44951410853).
      - name: Set up harness deps (numpy in venv)
        run: |
          python3 -m venv "$HOME/spike-venv"
          "$HOME/spike-venv/bin/pip" install --quiet numpy
      - name: Run spike harness (real vendored MPM/YIN runner vs committed fixtures)
        run: '"$HOME/spike-venv/bin/python" Tests/Spikes/run_spike.py --spike ribbon'

  # L-202 (M2): separation-spike is REAL-gated — continue-on-error REMOVED.
  # Mode is harness-driven per branch state: branches carrying Paul's
  # demucs_real.py runner (paul now, main after the M2 gate merge) run the REAL
  # path — the harness self-upgrades by invoking scripts/models/download.py for
  # the manifest-pinned htdemucs ggml (sha256 trust anchor, D-32.6/D-19.4) and
  # compiles the vendored runner like ribbon-spike does; branches without the
  # runner (main until gate) run the P-002 mock and stay green. The
  # actions/cache step makes the 84 MB fp16 weights a once-per-manifest
  # download across runs (real mode only; mock never downloads).
  separation-spike:
    name: "Separation spike (real htdemucs via vendored demucs.cpp when runner present; BLOCKING)"
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache pinned model downloads (htdemucs fp16 = 84 MB — once per manifest rev)
        uses: actions/cache@v4
        with:
          path: ~/pitchnotes-model-cache
          key: pitchnotes-models-${{ runner.os }}-${{ hashFiles('Models/manifest.json') }}
          restore-keys: |
            pitchnotes-models-${{ runner.os }}-
      - name: Set up harness deps (numpy in venv — runner python lacks it, run 44869099173)
        run: |
          python3 -m venv "$HOME/spike-venv"
          "$HOME/spike-venv/bin/pip" install --quiet numpy
      - name: Run spike harness (mock until demucs_real.py lands; real htdemucs after — SHA-verified)
        run: '"$HOME/spike-venv/bin/python" Tests/Spikes/run_spike.py --spike separation'

  basicpitch-spike:
    name: BasicPitch spike (P-002 mock harness)
    runs-on: macos-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up harness deps (numpy in venv — runner python lacks it, run 44869099173)
        run: |
          python3 -m venv "$HOME/spike-venv"
          "$HOME/spike-venv/bin/pip" install --quiet numpy
      - name: Run spike harness (mock model, no weights in M0)
        run: '"$HOME/spike-venv/bin/python" Tests/Spikes/run_spike.py --spike basicpitch'

  silero-vad-spike:
    name: Silero VAD spike (real pinned ONNX, L-101 BLOCKING)
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      PITCHNOTES_SPIKE_REAL: required
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Runner image python is 3.15 (run 44951410853 red) — onnxruntime ships
      # no cp315 wheels yet. Pin 3.13 for the ORT venv.
      - name: Set up Python 3.13 (onnxruntime wheels)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up harness deps (numpy + onnxruntime in venv — real-model mode)
        run: |
          python3 -m venv "$HOME/spike-venv"
          "$HOME/spike-venv/bin/pip" install --quiet numpy onnxruntime
      - name: Run spike harness (real D-19/D-20 pinned model, SHA-verified)
        run: '"$HOME/spike-venv/bin/python" Tests/Spikes/run_spike.py --spike silero-vad'

  # X-012 (P-106): NON-BLOCKING informational pitch bench — F1@50c/RPA/RCA per
  # Docs/BENCHMARKS §1 on the pinned swiftf0 (ONNX) + vendored ribbon-cpp
  # (sevagh compiles from vendor/ — g++ present on ubuntu); ribbon-swift rows
  # AUTO-SKIP without swiftc (loud skip note, never silent). `--assert` fails
  # the job only if a row that RAN misses the §2 F1 ≥ 0.75 target. Gate
  # candidate for M2 at Leto's discretion; never blocks an M1 merge.
  pitch-bench:
    name: Pitch bench v1 (P-106, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Pin 3.13 for onnxruntime wheels (deterministic across runner-image
      # python bumps — cp315 gap, run 44951410853).
      - name: Set up Python 3.13 (onnxruntime wheels)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up bench deps (numpy + onnxruntime in venv)
        run: |
          python3 -m venv "$HOME/spike-venv"
          "$HOME/spike-venv/bin/pip" install --quiet numpy onnxruntime
      - name: Run bench harness (assert §2 targets on every row that ran)
        run: '"$HOME/spike-venv/bin/python" Tests/Spikes/bench_f1.py --assert'
      - name: Upload bench report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report-v1
          path: Tests/Spikes/bench_report_v1.json
          if-no-files-found: warn

  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45
    # Docs-only pushes burn a 45-minute macOS runner for an identical binary.
    # workflow_dispatch is always accepted; paths-ignore handles most of it,
    # [ci skip] covers the rest.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[ci skip]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # X-201 branch-state adapter: xcodegen's `optional: true` still EMITS file
      # references for missing sources (run 45023233718 — "Build input file
      # cannot be found"). On branches without Paul's bridge files (main/leto
      # until the M2 gate merge), strip the two Engine/Separation entries so the
      # project generates clean; the 8 vendored demucs.cpp TUs compile
      # everywhere (Apple-clang proof). After the gate merge lands the bridge
      # on main this becomes a permanent no-op — remove it then.
      - name: Drop Engine/Separation source entries when bridge files are absent (X-201)
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          if Path('Engine/Separation/DemucsEngine.swift').exists():
              print('bridge files present — entries kept (full DemucsEngine compile)')
              raise SystemExit(0)
          p = Path('project.yml')
          s = p.read_text()
          s2 = re.sub(r'^      - path: Engine/Separation/\S+\n        optional: true\n', '', s, flags=re.M)
          assert s2 != s, 'expected Engine/Separation optional entries in project.yml'
          p.write_text(s2)
          print('bridge files absent — Engine/Separation entries stripped (branch-state adapter)')
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      # Any SPM dependency declaring `type: .dynamic` would become an
      # unembedded *.framework ref that crashes at launch inside LiveContainer
      # ("Library not loaded: @rpath/…"). Strip that declaration from EVERY
      # package checkout before building. Pins in Package.resolved untouched —
      # same versions, static linkage. (OR mirror products are already static;
      # this guards future deps. LiveContainer requirement, AGENTS §6.)
      - name: Patch SPM packages to link statically
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PitchNotesIOS.xcodeproj \
            -scheme PitchNotesIOS \
            -derivedDataPath build/DerivedData >/dev/null
          CHECKOUTS=build/DerivedData/SourcePackages/checkouts
          test -d "$CHECKOUTS" || { echo "::error::package checkouts not found at $CHECKOUTS"; exit 1; }
          PATCHED=0
          for MANIFEST in "$CHECKOUTS"/*/Package.swift; do
            if grep -q "type: .dynamic" "$MANIFEST"; then
              sed -i '' "/type: .dynamic/d" "$MANIFEST"
              echo "Patched to static: $(basename "$(dirname "$MANIFEST")")"
              PATCHED=$((PATCHED + 1))
            fi
          done
          echo "$PATCHED package manifest(s) patched."
          # The verify step after the archive enforces the outcome; a count of
          # 0 here is fine (upstream may have fixed their manifests).

      - name: Archive (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PitchNotesIOS.xcodeproj \
            -scheme PitchNotesIOS \
            -destination 'generic/platform=iOS' \
            -archivePath build/PitchNotesIOS.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee archive.log

      # The ONLY thing that kills LiveContainer is the app binary carrying
      # load commands for frameworks that aren't properly embedded/signed.
      # otool -L of the main binary is authoritative — fail on any dependency
      # outside /usr/lib and /System. SPM binaryTarget frameworks get copied
      # into Frameworks/ even when static (ONNX Runtime's iOS slice is a static
      # ar archive); unreferenced copies are dead weight — strip and log.
      - name: Verify app links no external frameworks + strip dead Frameworks/ copies (LiveContainer requirement)
        if: success()
        run: |
          APP=$(find build/PitchNotesIOS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)
          echo "--- .app overview ---"
          du -sh "$APP"
          ls "$APP"
          BIN="$APP/PitchNotes"
          echo "--- otool -L (system deps only is OK) ---"
          otool -L "$BIN"
          DEPS=$(otool -L "$BIN" | tail -n +2 | grep -vE '^[[:space:]]*/usr/lib/|^[[:space:]]*/System/' || true)
          if [ -n "$DEPS" ]; then
            echo "$DEPS"
            echo "::error::App binary references non-system frameworks/dylibs (see above) — LiveContainer will crash on launch (dyld Library not loaded). All SPM deps must link statically."
            exit 1
          fi
          if [ -d "$APP/Frameworks" ]; then
            echo "--- Frameworks/ contents ---"; ls -la "$APP/Frameworks"
            shopt -s nullglob
            for FW in "$APP/Frameworks"/*; do
              NAME=$(basename "$FW")
              if [ -d "$FW" ] && [[ "$NAME" == *.framework ]]; then
                MACHO="$FW/${NAME%.framework}"
              else
                MACHO="$FW"
              fi
              if [ -f "$MACHO" ]; then
                echo "--- $NAME: file(1) ---"; file "$MACHO"
                echo "--- $NAME: otool -L ---"; otool -L "$MACHO" || true
              fi
              echo "Stripping unreferenced $NAME from Frameworks/ (no load command points at it)"
              rm -rf "$FW"
            done
            rmdir "$APP/Frameworks" 2>/dev/null || true
          fi
          echo "OK: only system dependencies; Frameworks/ empty or removed"

      - name: Show archive failure summary
        if: failure()
        run: |
          grep -E "error:|fatal error|Assertion|Undefined symbol|Testing failed" archive.log \
            | grep -vE "warning:" \
            | tail -n 40 > build-summary.txt || true
          echo "----- BUILD FAILURE SUMMARY (last 40 matching lines) -----"
          cat build-summary.txt
          echo "-----------------------------------------------------------"
          if [ -s build-summary.txt ]; then
            python3 -c "import pathlib; t = pathlib.Path('build-summary.txt').read_text()[:5500]; print('::error title=App build failure::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          fi

      - name: Verify embedded version
        run: |
          APP_PATH="$(find build -path '*Products/Applications/*.app' -maxdepth 6 | head -n 1)"
          test -n "$APP_PATH" || { echo "::error::archived .app not found"; exit 1; }
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" 2>/dev/null || echo "")
          echo "Archived CFBundleShortVersionString: '$VERSION'"
          test -n "$VERSION" && test "$VERSION" != "1.0" || {
            echo "::error::archived Info.plist has no real version (got '$VERSION') — CFBundleShortVersionString is missing from the generated Info.plist"
            exit 1
          }

      - name: Verify background modes
        run: |
          # `audio` must be present and EXACT (background stem playback, J-203);
          # any second mode (fetch, voip, location, processing) is review-bait
          # and unused in v1. BGProcessingTask "quality mode" (§8) needs a
          # documented Leto ruling before it touches this list.
          APP_PATH="$(find build -path '*Products/Applications/*.app' -maxdepth 6 | head -n 1)"
          test -n "$APP_PATH" || { echo "::error::archived .app not found"; exit 1; }
          MODES=$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP_PATH/Info.plist" 2>/dev/null | grep -vE '[{}]' | grep -E '^[[:space:]]*[^[:space:]]' | tr -d ' \t' | tr '\n' ',' | sed 's/,$//')
          echo "Archived UIBackgroundModes: $MODES"
          test "$MODES" = "audio" || {
            echo "::error::UIBackgroundModes must be exactly [audio] (got: $MODES)."
            exit 1
          }

      - name: Package unsigned IPA
        if: success()
        run: ./Scripts/package-ipa.sh build/PitchNotesIOS.xcarchive

      # L-202: sizes logged every run + §8 guard. Weights NEVER ship in the IPA
      # (runtime download + SHA256 verify per manifest) — a >200 MB IPA means a
      # model got embedded by accident. Real M1/M2 IPAs are O(tens of MB).
      - name: IPA size check (L-202 — §8 core budget guard)
        if: success()
        run: |
          IPA_MB=$(du -sm dist/PitchNotesIOS.ipa | cut -f1)
          APP_PATH="$(find build -path '*Products/Applications/*.app' -maxdepth 6 | head -n 1)"
          APP_MB=$(du -sm "$APP_PATH" | cut -f1)
          echo "IPA size: ${IPA_MB} MB; app bundle: ${APP_MB} MB"
          echo "ipa_size_mb=${IPA_MB}" >> "$GITHUB_STEP_SUMMARY"
          echo "app_bundle_mb=${APP_MB}" >> "$GITHUB_STEP_SUMMARY"
          test "$IPA_MB" -lt 200 || {
            echo "::error::IPA ${IPA_MB} MB exceeds the 200 MB §8 core guard — weights must download at runtime, never ship"
            exit 1
          }

      - name: Upload dSYM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dSYMs
          path: build/PitchNotesIOS.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PitchNotesIOS
          path: dist/PitchNotesIOS.ipa
          if-no-files-found: error
          # 90 days (Actions default, explicit): gate evidence URLs are recorded
          # in QUEUE.md rows + LOG and must outlive branch-push churn.
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: archive.log
          if-no-files-found: warn
          retention-days: 14
