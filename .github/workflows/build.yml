name: Build IPA

# Clone of thesagezm/speechnotes-ios .github/workflows/build.yml (AGENTS §6),
# renamed to PitchNotes and extended with the three-agent branch model:
# push to main/paul/jess/leto (path-filtered) + workflow_dispatch on any ref.
#
# M1 gate state (L-101 ACTIVATED): swiftf0/ribbon/silero spikes run the REAL
# pinned models and are BLOCKING (no continue-on-error); separation/basicpitch
# remain mock + allow-failure until their real runners land (M2/M3).
#
# M3 gate state (L-304, 2026-11-27): separation (M2/L-202) and basicpitch
# (M3/P-301) run their REAL runners and are BLOCKING; bench-v2 (P-306) is
# BLOCKING. The ONLY job left allow-failure is pitch-bench v1 (P-106), which is
# informational by design.

concurrency:
  # One run per branch: a push during an active build cancels the older run
  # (they'd both finish with the same result). Branch-level key keeps
  # main/paul/jess/leto runs parallel.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, paul, jess, leto]
    paths-ignore:
      - 'Docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  logic-tests:
    name: Logic tests (PitchLogic + model manifest)
    runs-on: macos-latest
    # X-203: 10 min killed the suite twice (45024720426, one prior) as the
    # M2 suites grew (EngineCore 112 + PitchLogic ~110 + MicCapture) — 15
    # gives headroom without masking hangs (Paul evidence two-for-two).
    # +5 (L-204): the X-204 ImportKit step installs ffmpeg via Homebrew on
    # the macOS runner (it is NOT in the runner image — verified against
    # actions/runner-images macos-15-Readme.md), which costs ~1-3 min. 20
    # keeps the job inside its bound without accepting a skip instead of the
    # proven leg (the step hard-fails if ffmpeg is still missing).
    # X-215 (Jess, measured): 20 was TIGHT — run 45430514534 was killed by
    # the job's own bound at exactly 20m03s with its OTHER 7 JOBS GREEN, and
    # the two most recent GREEN runs took 11m00s and 14m11s (a 3-minute
    # swing on the SAME suite). The step timeline of the green 11-minute run
    # shows PitchLogic itself at 40 s and the EngineCore step (SPM
    # resolve/build of the ORT-dependent packages) at 7m36s — the variable
    # part. 35 still kills a genuine hang (longest observed healthy run =
    # 14m11s) while absorbing runner/dependency-build variance. A spurious
    # CANCELLED logic-tests makes every M3 gate run read RED and costs the
    # next agent a whole session of re-diagnosing what is a capacity
    # artifact. (Her alternative — splitting the EngineCore step into its
    # own job — is DEFERRED: it changes the job graph the merge gates
    # reference; the one-line bound is the minimal fix.)
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate model manifest schema (L-005)
        run: python3 -I scripts/models/download.py --manifest Models/manifest.json --validate-only

      # D-2 placeholder until the human creates thesagezm/pitchnotes-models.
      # test-blob: committed 1 KB, verified via file:// — raw.githubusercontent.com
      # 404s for private repos without auth (run 44840060323).
      - name: Verify committed test blob (file://, D-2 placeholder)
        run: |
          python3 -I scripts/models/download.py \
            --manifest Models/manifest.json \
            --entry test-blob \
            --url "file://${{ github.workspace }}/Models/test-blob.bin" \
            --cache-dir "$HOME/pitchnotes-model-cache"

      # Real HTTP + SHA256 over the network: immutable public file pinned by
      # commit SHA (public speechnotes-ios). Proves download.py's fetch/verify
      # path end-to-end until the public HF repo replaces the probes (D-2).
      - name: Download + SHA256-verify public http-probe
        run: |
          python3 -I scripts/models/download.py \
            --manifest Models/manifest.json \
            --entry http-probe \
            --cache-dir "$HOME/pitchnotes-model-cache"

      # D-19 interim rule (L-101): REAL model entries pinned to upstream
      # immutable URLs (HF revision / GitHub commit) + Leto-verified SHA256,
      # until thesagezm/pitchnotes-models exists (D-2, BLOCKED(human)).
      # Blocking here: proves the exact bytes the spikes will consume hash out
      # on every run, and warms the CI cache for the spike jobs.
      - name: Download + SHA256-verify swiftf0 (D-19 pinned upstream)
        run: |
          python3 -I scripts/models/download.py \
            --manifest Models/manifest.json \
            --entry swiftf0 \
            --cache-dir "$HOME/pitchnotes-model-cache"

      - name: Download + SHA256-verify silero-vad (D-19 pinned upstream)
        run: |
          python3 -I scripts/models/download.py \
            --manifest Models/manifest.json \
            --entry silero-vad \
            --cache-dir "$HOME/pitchnotes-model-cache"

      # X-008c (D-27.5, BLOCKING since X-013 landed — Paul's seam compiles and
      # the real-model tests pass green on run 44981256783): the tests locate
      # the cache the download steps above just filled ($HOME/pitchnotes-model-
      # cache, then <ws>/Models/downloads fallback); XCTSkip when no cached
      # model (local runs without the cache).
      - name: Run PitchORT package tests (real model via cache, X-008c BLOCKING)
        run: |
          set -o pipefail
          cd Engine/PitchORT
          swift test 2>&1 | tee ../pitchort-tests.log

      # X-011b (P-104, BLOCKING since X-013 landed — 7 smoke tests committed and
      # green on run 44981256783): config math + interruption-hook state
      # machine. NO mic needed, no capture started.
      - name: Run MicCapture package tests (X-011b BLOCKING)
        run: |
          set -o pipefail
          cd Engine/MicCapture
          swift test 2>&1 | tee ../miccapture-tests.log

      # X-204 (P-203 ac leg, BLOCKING where present): ImportKit format-import
      # tests — 3 lossless BIT-IDENTITY vs ffmpeg reference (loud XCTSkip if
      # ffmpeg missing, never fake-pass), 1 MP3 tolerance (CoreAudio vs ffmpeg
      # differ sample-wise; ±2048-frame alignment, max|Δ|<0.02), 1 48k→44.1k
      # structural, 2 error-contract. Fixtures committed; tests #filePath-
      # relative. BRANCH-STATE CONDITIONAL: Engine/ImportKit lands on main at
      # the M2 gate merge (paul has it now) — Paul's "committed on ALL
      # branches" premise verified FALSE (ls-tree origin/main empty), so a
      # plain project.yml package entry would hard-fail SPM resolve on main
      # (X-201 r1 class). Package+dep wiring defers to the gate merge; this
      # step proves the ac where the package exists and skips where it can't.
      #
      # FFMPEG IS NOT ON THE macOS RUNNER IMAGE (verified 2026-11-22 against
      # actions/runner-images macos-15-Readme.md — no ffmpeg anywhere in the
      # installed-software list; ubuntu images do ship it). Paul's ImportKit
      # tests would therefore XCTSkip their 3 bit-identity + 1 MP3-tolerance
      # cases and the leg would be GREEN-BUT-UNPROVEN — exactly the shape this
      # milestone forbids. So we INSTALL ffmpeg here (build-time tool only,
      # never linked into the app; already used by scripts/fixtures/gen.py on
      # the ubuntu runner) and then HARD-FAIL if it is still missing: the leg
      # must be PROVEN or the job must be RED — a skip may not stand in for
      # the acceptance criterion.
      - name: Run ImportKit package tests (X-204 BLOCKING where present)
        if: ${{ hashFiles('Engine/ImportKit/Package.swift') != '' }}
        run: |
          set -o pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "::notice::ffmpeg absent on this runner — installing (build-time reference decoder only)"
            brew install ffmpeg
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "::error::ffmpeg unavailable — ImportKit reference-decode tests would SKIP, so P-203's 'each format fixture imports' leg would be UNPROVEN. Failing instead of accepting a skip."
            exit 1
          fi
          ffmpeg -version | head -1
          cd Engine/ImportKit
          swift test 2>&1 | tee ../importkit-tests.log

      - name: Run PitchLogic package tests
        run: |
          set -o pipefail
          cd Tests/Logic
          swift test 2>&1 | tee ../../logic-tests.log

      # Paul's EngineCore (P-001): contract types + validators + MockEngine.
      # Foundation-only — compiles and tests on the macOS runner (first macOS
      # compile of this package happens here; Linux-verified until X-003 wiring).
      - name: Run EngineCore package tests
        run: |
          set -o pipefail
          cd Engine
          swift test 2>&1 | tee ../engine-tests.log

      - name: Upload engine test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-tests-log
          path: engine-tests.log
          if-no-files-found: warn

      - name: Upload PitchORT test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitchort-tests-log
          path: pitchort-tests.log
          if-no-files-found: warn

      - name: Upload MicCapture test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miccapture-tests-log
          path: miccapture-tests.log
          if-no-files-found: warn

      - name: Upload ImportKit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: importkit-tests-log
          path: importkit-tests.log
          if-no-files-found: ignore

      - name: Show failure summary
        if: failure()
        run: |
          grep -E "error:|failed|XCTAssert" logic-tests.log | tail -n 30 > summary.txt || true
          echo "----- LOGIC TEST FAILURE SUMMARY (last 30 matching lines) -----"
          cat summary.txt
          echo "-------------------------------------------------------------------"
          if [ -s summary.txt ]; then
            python3 -c "import pathlib; t = pathlib.Path('summary.txt').read_text()[:5500]; print('::error title=Logic tests failure::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          fi

      - name: Upload logic test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logic-tests-log
          path: logic-tests.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # SPIKE JOBS. M1 ACTIVATION (L-101, gate): swiftf0/ribbon/silero run the
  # REAL pinned models — venv carries numpy+onnxruntime, PITCHNOTES_SPIKE_REAL
  # =required makes the silent mock fallback a HARD failure (no mock at merge
  # time), and continue-on-error is REMOVED (blocking). separation/basicpitch
  # are now REAL and BLOCKING too (L-202 / L-304).
  # Job NAMES are final — merge gates reference these exact IDs (AGENTS §3/§6).
  # ---------------------------------------------------------------------
  swiftf0-spike:
    name: SwiftF0 spike (real pinned ONNX, L-101 BLOCKING)
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      PITCHNOTES_SPIKE_REAL: required
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Runner image python is 3.15 (run 44951410853 red) — onnxruntime ships
      # no cp315 wheels yet. Pin 3.13 for the ORT venv.
      - name: Set up Python 3.13 (onnxruntime wheels)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up harness deps (numpy + onnxruntime in venv — real-model mode)
        run: |
          python3 -m venv "$HOME/spike-venv"
          "$HOME/spike-venv/bin/pip" install --quiet numpy onnxruntime
      - name: Run spike harness (real D-19/D-20 pinned model, SHA-verified)
        run: '"$HOME/spike-venv/bin/python" Tests/Spikes/run_spike.py --spike swiftf0'

  # D-19 rename: nanopitch-spike -> ribbon-spike. The M1 gate spike tests the
  # D-17 ribbon default (vendored sevagh MPM/YIN, MIT — vendor/pitch-detection),
  # NOT NanoPitch (pretrained weights banned, GTSinger NC data). P-102 landed
  # the REAL C++ runner (Tests/Spikes/ribbon_real.py compiles vendor/ + kissfft
  # with clang++/g++ — present on macOS runners); X-009 flips the job line to
  # `--spike ribbon` and L-101 makes it BLOCKING (no mock fallback).
  ribbon-spike:
    name: "Causal ribbon spike (D-19 MPM/YIN real vendored runner, L-101 BLOCKING)"
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      PITCHNOTES_SPIKE_REAL: required
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The ribbon runner is the vendored C++ MPM/YIN (clang++, present on
      # macOS) — numpy only; NO onnxruntime dependency here (immune to the
      # runner-python wheel gap, run 44951410853).
      - name: Set up harness deps (numpy in venv)
        run: |
          python3 -m venv "$HOME/spike-venv"
          "$HOME/spike-venv/bin/pip" install --quiet numpy
      - name: Run spike harness (real vendored MPM/YIN runner vs committed fixtures)
        run: '"$HOME/spike-venv/bin/python" Tests/Spikes/run_spike.py --spike ribbon'

  # L-202 (M2): separation-spike is REAL-gated — continue-on-error REMOVED.
  # Mode is harness-driven per branch state: branches carrying Paul's
  # demucs_real.py runner (paul now, main after the M2 gate merge) run the REAL
  # path — the harness self-upgrades by invoking scripts/models/download.py for
  # the manifest-pinned htdemucs ggml (sha256 trust anchor, D-32.6/D-19.4) and
  # compiles the vendored runner like ribbon-spike does; branches without the
  # runner (main until gate) run the P-002 mock and stay green. The
  # actions/cache step makes the 84 MB fp16 weights a once-per-manifest
  # download across runs (real mode only; mock never downloads).
  separation-spike:
    name: "Separation spike (real htdemucs via vendored demucs.cpp when runner present; BLOCKING)"
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache pinned model downloads (htdemucs fp16 = 84 MB — once per manifest rev)
        uses: actions/cache@v4
        with:
          path: ~/pitchnotes-model-cache
          key: pitchnotes-models-${{ runner.os }}-${{ hashFiles('Models/manifest.json') }}
          restore-keys: |
            pitchnotes-models-${{ runner.os }}-
      - name: Set up harness deps (numpy in venv — runner python lacks it, run 44869099173)
        run: |
          python3 -m venv "$HOME/spike-venv"
          "$HOME/spike-venv/bin/pip" install --quiet numpy
      - name: Run spike harness (mock until demucs_real.py lands; real htdemucs after — SHA-verified)
        run: '"$HOME/spike-venv/bin/python" Tests/Spikes/run_spike.py --spike separation'

  # ---------------------------------------------------------------------
  # L-302 (M3): basicpitch-spike goes REAL.
  #
  # THE RULE THIS JOB ENFORCES (X-206's general rule — "a conditional step
  # that can only skip is not evidence"): the P-002 MOCK may NOT stand in for
  # the real basic-pitch path. A green mock here would be green-but-unproven,
  # and the M3 gate requires a REAL, gate-blocking basicpitch-spike.
  #
  # THE SPLIT (Leto's lane vs Paul's — stated so nobody guesses):
  #   - LETO (.github/**): this job — the preconditions, the SHA-pinned
  #     download, the REAL-mode assertion, the parity leg.
  #   - PAUL (Tests/Spikes/**): `Tests/Spikes/basicpitch_real.py` (the runner),
  #     the `basic-pitch` entry in Models/manifest.json (Models/**), and the
  #     `real_runners` + `_try_real()` wiring inside run_spike.py.
  # The vendored basicpitch.cpp sources are ALREADY on main (@bb3fc98), so
  # the runner is writable today.
  #
  # UNTIL PAUL LANDS THOSE, THIS JOB IS RED BY DESIGN — it says exactly which
  # piece is missing and who owns it.
  #
  # M3 GATE (L-304, 2026-11-27): P-301 HAS LANDED and the job is GREEN FOR REAL
  # — run 45904236220@c3f245e, all of its checks pass on `main` with the vendored
  # basicpitch.cpp runner + the mono/poly fixtures. `continue-on-error` is
  # REMOVED: this job is BLOCKING from here on. The QUEUE row carries the flip.
  # ---------------------------------------------------------------------
  basicpitch-spike:
    name: "BasicPitch spike (REAL basic-pitch ONNX via the vendored basicpitch.cpp — P-301 runner; BLOCKING)"
    runs-on: macos-latest
    # 30 min: this job runs the REAL pipeline THREE times — the harness run
    # (which proves Paul's run_spike.py wiring), the direct parity run, and the
    # corruption proof (which re-runs the whole thing against a perturbed
    # vendored C++ side). The old 20-min bound was tuned for a job that only
    # compiled; the real path also runs the model.
    timeout-minutes: 30
    env:
      PITCHNOTES_SPIKE_REAL: required
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache pinned model downloads (once per manifest rev)
        uses: actions/cache@v4
        with:
          path: ~/pitchnotes-model-cache
          key: pitchnotes-models-${{ runner.os }}-${{ hashFiles('Models/manifest.json') }}
          restore-keys: |
            pitchnotes-models-${{ runner.os }}-
      # Runner image python is 3.15 (run 44951410853 red) — onnxruntime ships
      # no cp315 wheels yet. Pin 3.13 for the ORT venv.
      - name: Set up Python 3.13 (onnxruntime wheels)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up harness deps (numpy + onnxruntime in venv)
        run: |
          python3 -m venv "$HOME/spike-venv"
          "$HOME/spike-venv/bin/pip" install --quiet numpy onnxruntime

      # The honest-failure gate: name EVERY missing precondition and its
      # owner, then fail. No silent mock, no "skipped because not present".
      - name: Preconditions — the REAL basicpitch path must exist (P-301)
        run: |
          "$HOME/spike-venv/bin/python" -I - <<'PY'
          import json, os, sys
          missing = []
          try:
              names = {m["name"] for m in json.load(open("Models/manifest.json"))["models"]}
          except Exception as e:
              names = set()
              print(f"::error::Models/manifest.json is unreadable ({e}) — Models/** is PAUL's lane (AGENTS §12).")
              sys.exit(1)
          if "basic-pitch" not in names:
              missing.append("manifest-entry")
          if not os.path.exists("Tests/Spikes/basicpitch_real.py"):
              missing.append("runner")
          if missing:
              if "manifest-entry" in missing:
                  print("::error::Models/manifest.json has NO 'basic-pitch' entry — that entry is PAUL's lane (Models/**, AGENTS §12) and ships with his branch (origin/paul @fd8cac6). Without it there is no SHA-pinned weight to download, so the REAL spike cannot run. NOT a CI bug and NOT a Leto-lane gap.")
              if "runner" in missing:
                  print("::error::Tests/Spikes/basicpitch_real.py is MISSING — the real runner is PAUL's lane (Tests/Spikes/**, AGENTS §12). The vendored basicpitch.cpp sources ARE on main (@bb3fc98), so the runner can be written now.")
              print("::error::The REAL basicpitch path is incomplete — P-301 is the blocker. Failing instead of accepting the P-002 mock (a green mock here is green-but-unproven; X-206 rule).")
              sys.exit(1)
          print("preconditions OK: 'basic-pitch' manifest entry + Tests/Spikes/basicpitch_real.py both present")
          PY

      # SHA-pinned weights (D-42 Tier B — never in git, never claimed clean).
      # PITCHNOTES_MODEL_CACHE is exported so PAUL's runner
      # (Tests/Spikes/basicpitch_real.py → ensure_model()) resolves the SAME
      # cache dir this step populated — otherwise it re-downloads the weights
      # into Models/downloads and the actions/cache above never helps.
      - name: Download + SHA256-verify basic-pitch weights (manifest-pinned, D-42 Tier B)
        run: |
          export PITCHNOTES_MODEL_CACHE="$HOME/pitchnotes-model-cache"
          "$HOME/spike-venv/bin/python" -I scripts/models/download.py \
            --manifest Models/manifest.json \
            --entry basic-pitch \
            --cache-dir "$PITCHNOTES_MODEL_CACHE"

      - name: Run spike harness (REAL required — PITCHNOTES_SPIKE_REAL=required)
        run: |
          set -o pipefail
          "$HOME/spike-venv/bin/python" -I Tests/Spikes/run_spike.py --spike basicpitch 2>&1 | tee basicpitch-spike.log

      # The harness prints "PASSED: basicpitch-spike (real)" only when the real
      # path ran AND every real check passed (LAST_MODE + no violations).
      # Asserting it HERE is what makes this job real-gating: the harness
      # itself cannot fail on a missing basicpitch entry in real_runners, so
      # without this assertion the job would pass on the MOCK.
      # NOTE the exact "PASSED:" prefix — a "FAILED: basicpitch-spike (real)"
      # line also contains "(real)", and a failed real run must NOT satisfy
      # this assertion (the step's own pipefail catches it too; this grep is
      # the second, independent guard).
      - name: Assert the spike ran REAL (the P-002 mock may NOT pass this job)
        run: |
          if ! grep -q "PASSED: basicpitch-spike (real)" basicpitch-spike.log; then
            echo "::error::The basicpitch spike did NOT pass in REAL mode (no 'PASSED: basicpitch-spike (real)' line in the harness output) — the P-002 MOCK ran instead, or the real run failed. The real path is not wired, so this job would be GREEN-BUT-UNPROVEN. The wiring is PAUL's lane: add 'basicpitch' to real_runners (module 'basicpitch_real', function 'run_basicpitch_real') and call _try_real('basicpitch', report) inside run_basicpitch() in Tests/Spikes/run_spike.py. Failing instead of accepting the mock."
            grep -E "basicpitch|PASSED|FAILED|mock|real" basicpitch-spike.log | tail -n 20 || true
            exit 1
          fi
          echo "OK: the basicpitch spike ran in REAL mode"

      # CI CONTRACT (Leto, L-302) — REWRITTEN 2026-11-24 to match what PAUL
      # ACTUALLY LANDED (`origin/paul` @da5fe31: Tests/Spikes/basicpitch_real.py
      # + Tests/Spikes/basicpitch_runner.cpp).
      #
      # The earlier contract asked for a `--parity` flag and a COMMITTED C-7
      # sidecar set under Tests/Spikes/ReferenceTensors/basicpitch/*.bin. PAUL
      # built a DIFFERENT (and, for a live CI gate, better) shape: his runner
      # script has NO `--parity` flag, and the parity is INSIDE the real run —
      # it compares the vendored C++ pipeline's tensors and note events against
      # an INDEPENDENT PYTHON ONNX RUNTIME reference (Tests/Spikes/basicpitch_ref.py)
      # at the C-7 tolerance (abs 1e-3 OR rel 1e-4), and it exits NON-ZERO on a
      # mismatch. That is a true CROSS-IMPLEMENTATION parity (two independent
      # decoders, not one decoder compared with itself), so the CI below now
      # consumes what he built instead of a shape that does not exist.
      # (Per L-302: adjust LETO's CI to what PAUL landed — never his files.)
      - name: Parity — the vendored pipeline vs the independent Python reference (C-7 tolerance)
        run: |
          set -o pipefail
          export PITCHNOTES_MODEL_CACHE="$HOME/pitchnotes-model-cache"
          "$HOME/spike-venv/bin/python" -I Tests/Spikes/basicpitch_real.py 2>&1 | tee basicpitch-parity.log
          echo "--- the parity evidence (S4 tensors / S5 events), which MUST be present and green ---"
          grep -E "tensor parity|note events match|amplitude parity" basicpitch-parity.log || true
          if ! grep -q "BASICPITCH REAL SPIKE GREEN" basicpitch-parity.log; then
            echo "::error::the direct real run did not report GREEN — the parity leg (S4 tensor parity vs the independent Python reference, S5 event parity) is NOT satisfied. Failing instead of accepting it."
            exit 1
          fi

      # "A CORRUPTED PORT MUST FAIL" — PROVED, not asserted (D-24 / P-208).
      #
      # The corruption is applied to THE C++ SIDE ONLY: the vendored pipeline
      # (vendor/basicpitch/src/ort_inference.cpp — LETO's lane, AGENTS §12) is
      # perturbed ON PURPOSE in this checkout, and the SAME comparison must then
      # REJECT it. The Python reference is untouched, so only a comparison that
      # genuinely compares the two sides can catch this. If the comparison were
      # vacuous (or absent), the corrupted run would still pass and this step
      # fails the job.
      #
      # If the perturbation cannot be applied (the anchor moved), the step FAILS
      # LOUDLY — a proof that cannot be applied is never a silent pass.
      - name: Prove the parity comparison REJECTS a corrupted C++ side (vendor perturbed on purpose)
        run: |
          set -o pipefail
          export PITCHNOTES_MODEL_CACHE="$HOME/pitchnotes-model-cache"
          SRC=vendor/basicpitch/src/ort_inference.cpp
          cp "$SRC" "$SRC.orig"
          "$HOME/spike-venv/bin/python" -I - "$SRC" <<'PY'
          import sys
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()
          anchor = "return InferenceResult{unwrapped_notes"
          if anchor not in src:
              print("::error::the corruption anchor moved in " + p +
                    " ('return InferenceResult{unwrapped_notes' not found) — the parity "
                    "NON-VACUITY PROOF cannot be applied. Failing loudly: a proof that "
                    "cannot be applied is never a silent pass. Fix this step or the "
                    "vendor file, do NOT skip it.")
              sys.exit(1)
          inject = (
              "    // CI CORRUPTION PROOF (Leto, L-302) — PERTURBED ON PURPOSE.\n"
              "    // The vendored C++ side is shifted by +0.05; the independent Python\n"
              "    // reference is NOT touched. A real comparison MUST reject this.\n"
              "    // An ADDITIVE constant is used deliberately: it changes EVERY element\n"
              "    // (including exact zeros, which a multiplicative scale would leave\n"
              "    // untouched), and |0.05| is far above the C-7 abs tolerance (1e-3).\n"
              "    for (Eigen::Index ci = 0; ci < unwrapped_notes.size(); ++ci) {\n"
              "        unwrapped_notes.data()[ci] += 0.05f;\n"
              "    }\n\n"
          )
          open(p, "w", encoding="utf-8").write(src.replace(anchor, inject + anchor, 1))
          print("perturbed " + p + " (notes tensor scaled 1.5x)")
          PY
          set +e
          "$HOME/spike-venv/bin/python" -I Tests/Spikes/run_spike.py --spike basicpitch > corrupted-parity.log 2>&1
          RC=$?
          set -e
          tail -n 25 corrupted-parity.log || true
          mv -f "$SRC.orig" "$SRC"
          if [ "$RC" -eq 0 ]; then
            echo "::error::the parity comparison PASSED against a CORRUPTED C++ side — the comparison is VACUOUS (it does not actually compare the vendored runner against the independent reference). D-24/P-208's 'a corrupted port must FAIL' is NOT met."
            exit 1
          fi
          if ! grep -q "TENSOR PARITY FAILED" corrupted-parity.log; then
            echo "::error::the corrupted run failed (exit $RC) but NOT with a parity violation — it failed for some other reason (e.g. a compile error), so this did NOT prove the parity comparison is non-vacuous. See corrupted-parity.log."
            exit 1
          fi
          echo "OK: the parity comparison REJECTED the corrupted C++ side (exit $RC, TENSOR PARITY FAILED) — the comparison is not vacuous"

      - name: Upload basicpitch spike + parity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basicpitch-spike-log
          path: |
            basicpitch-spike.log
            basicpitch-parity.log
            corrupted-parity.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # L-302 (M3): bench v2 — the HONEST-metrics job.
  #
  # P-306 (PAUL's lane) owns the harness + the BENCHMARKS.md report; this job
  # only CONSUMES it and enforces the one thing the M3 gate cares about:
  # part-AGNOSTIC and part-AWARE metrics reported SEPARATELY (PLAN M3 /
  # AGENTS §11 honesty rail). It also requires the external part-agnostic
  # reference point (dettato's Dagstuhl ChoirSet row: onset 55.9 / frame 82.0
  # / offset 44.4) to be cited in the report, so the two families can never be
  # silently mixed.
  #
  # M3 GATE (L-304, 2026-11-27): P-306 HAS LANDED and the job is GREEN —
  # run 45906329503@2d6f50e passes on `main`. `continue-on-error` is REMOVED:
  # this job is BLOCKING from here on. The report it produces must keep the
  # part-AGNOSTIC and the part-AWARE families SEPARATE and must cite dettato's
  # Dagstuhl ChoirSet row (onset 55.9 / frame 82.0 / offset 44.4).
  # ---------------------------------------------------------------------
  bench-v2:
    name: "Bench v2 (P-306 — part-AGNOSTIC + part-AWARE reported separately; BLOCKING)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13 (onnxruntime wheels)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up bench deps (numpy + onnxruntime in venv)
        run: |
          python3 -m venv "$HOME/spike-venv"
          "$HOME/spike-venv/bin/pip" install --quiet numpy onnxruntime

      - name: Run bench v2 harness (PAUL's P-306 harness, --assert)
        run: |
          set -o pipefail
          if [ ! -f Tests/Spikes/bench_v2.py ]; then
            echo "::error::Tests/Spikes/bench_v2.py is MISSING — the bench v2 harness is PAUL's lane (Tests/Spikes/**, AGENTS §12) and lands with P-306. I do NOT write his harness (L-302's note). Failing instead of reporting a bench that does not exist."
            exit 1
          fi
          "$HOME/spike-venv/bin/python" -I Tests/Spikes/bench_v2.py --assert 2>&1 | tee bench-v2.log

      # The gate's honesty requirement, enforced in CI: the report must carry
      # BOTH metric families as SEPARATE sections, and the external
      # part-agnostic reference point must be cited. The key matching is
      # tolerant of naming ("part_agnostic" / "part-agnostic" / "agnostic"),
      # but strict about substance: both families must be present and
      # non-empty.
      - name: Assert the report has BOTH part-AGNOSTIC and part-AWARE sections
        run: |
          REPORT=Tests/Spikes/bench_report_v2.json
          if [ ! -f "$REPORT" ]; then
            echo "::error::$REPORT was not produced by the bench v2 harness — P-306 must write the deterministic report artifact (same convention as bench_report_v1.json)."
            exit 1
          fi
          "$HOME/spike-venv/bin/python" -I - "$REPORT" <<'PY'
          import json, sys
          path = sys.argv[1]
          d = json.load(open(path))
          if not isinstance(d, dict):
              print(f"::error::{path}: top level must be an object")
              sys.exit(1)
          def find(sub):
              for k, v in d.items():
                  if sub in k.lower():
                      return k, v
              return None, None
          ka, va = find("agnostic")
          kw, vw = find("aware")
          missing = []
          if ka is None or not va:
              missing.append("part-AGNOSTIC")
          if kw is None or not vw:
              missing.append("part-AWARE")
          if missing:
              print(f"::error::{path}: missing/non-empty-false section(s): {', '.join(missing)}. The M3 gate requires part-AGNOSTIC and part-AWARE metrics reported SEPARATELY (PLAN M3, AGENTS §11) — a single blended number is a contract violation, not a style nit.")
              print("::error::top-level keys present: " + ", ".join(sorted(d.keys())))
              sys.exit(1)
          text = json.dumps(d)
          for ref in ("55.9", "82.0", "44.4"):
              if ref not in text:
                  print(f"::error::{path}: the external part-agnostic reference point (dettato Dagstuhl ChoirSet: onset 55.9 / frame 82.0 / offset 44.4) is not cited — the reference number {ref} is absent, so the report cannot be checked against the published part-agnostic baseline (PLAN P-306 / RESEARCH Addendum A.1).")
                  sys.exit(1)
          print(f"OK: report carries '{ka}' + '{kw}' and cites the Dagstuhl ChoirSet part-agnostic reference")
          PY

      - name: Upload bench v2 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report-v2
          path: Tests/Spikes/bench_report_v2.json
          if-no-files-found: warn

  silero-vad-spike:
    name: Silero VAD spike (real pinned ONNX, L-101 BLOCKING)
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      PITCHNOTES_SPIKE_REAL: required
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Runner image python is 3.15 (run 44951410853 red) — onnxruntime ships
      # no cp315 wheels yet. Pin 3.13 for the ORT venv.
      - name: Set up Python 3.13 (onnxruntime wheels)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up harness deps (numpy + onnxruntime in venv — real-model mode)
        run: |
          python3 -m venv "$HOME/spike-venv"
          "$HOME/spike-venv/bin/pip" install --quiet numpy onnxruntime
      - name: Run spike harness (real D-19/D-20 pinned model, SHA-verified)
        run: '"$HOME/spike-venv/bin/python" Tests/Spikes/run_spike.py --spike silero-vad'

  # X-012 (P-106): NON-BLOCKING informational pitch bench — F1@50c/RPA/RCA per
  # Docs/BENCHMARKS §1 on the pinned swiftf0 (ONNX) + vendored ribbon-cpp
  # (sevagh compiles from vendor/ — g++ present on ubuntu); ribbon-swift rows
  # AUTO-SKIP without swiftc (loud skip note, never silent). `--assert` fails
  # the job only if a row that RAN misses the §2 F1 ≥ 0.75 target. Gate
  # candidate for M2 at Leto's discretion; never blocks an M1 merge.
  pitch-bench:
    name: Pitch bench v1 (P-106, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Pin 3.13 for onnxruntime wheels (deterministic across runner-image
      # python bumps — cp315 gap, run 44951410853).
      - name: Set up Python 3.13 (onnxruntime wheels)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up bench deps (numpy + onnxruntime in venv)
        run: |
          python3 -m venv "$HOME/spike-venv"
          "$HOME/spike-venv/bin/pip" install --quiet numpy onnxruntime
      - name: Run bench harness (assert §2 targets on every row that ran)
        run: '"$HOME/spike-venv/bin/python" Tests/Spikes/bench_f1.py --assert'
      - name: Upload bench report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report-v1
          path: Tests/Spikes/bench_report_v1.json
          if-no-files-found: warn

  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45
    # Docs-only pushes burn a 45-minute macOS runner for an identical binary.
    # workflow_dispatch is always accepted; paths-ignore handles most of it,
    # [ci skip] covers the rest.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[ci skip]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The X-201 branch-state adapter that used to live here is GONE (M2 gate
      # step 5): it stripped the two Engine/Separation source entries when
      # Paul's bridge files were absent. The M2 gate merge (#11 @9909415) landed
      # those files on main, and the project.yml entries are now NON-optional —
      # a missing bridge file must FAIL LOUDLY instead of silently producing an
      # app with no separation engine.

      - name: Generate Xcode project
        run: xcodegen generate

      # Any SPM dependency declaring `type: .dynamic` would become an
      # unembedded *.framework ref that crashes at launch inside LiveContainer
      # ("Library not loaded: @rpath/…"). Strip that declaration from EVERY
      # package checkout before building. Pins in Package.resolved untouched —
      # same versions, static linkage. (OR mirror products are already static;
      # this guards future deps. LiveContainer requirement, AGENTS §6.)
      - name: Patch SPM packages to link statically
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PitchNotesIOS.xcodeproj \
            -scheme PitchNotesIOS \
            -derivedDataPath build/DerivedData >/dev/null
          CHECKOUTS=build/DerivedData/SourcePackages/checkouts
          test -d "$CHECKOUTS" || { echo "::error::package checkouts not found at $CHECKOUTS"; exit 1; }
          PATCHED=0
          for MANIFEST in "$CHECKOUTS"/*/Package.swift; do
            if grep -q "type: .dynamic" "$MANIFEST"; then
              sed -i '' "/type: .dynamic/d" "$MANIFEST"
              echo "Patched to static: $(basename "$(dirname "$MANIFEST")")"
              PATCHED=$((PATCHED + 1))
            fi
          done
          echo "$PATCHED package manifest(s) patched."
          # The verify step after the archive enforces the outcome; a count of
          # 0 here is fine (upstream may have fixed their manifests).

      - name: Archive (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PitchNotesIOS.xcodeproj \
            -scheme PitchNotesIOS \
            -destination 'generic/platform=iOS' \
            -archivePath build/PitchNotesIOS.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee archive.log

      # The ONLY thing that kills LiveContainer is the app binary carrying
      # load commands for frameworks that aren't properly embedded/signed.
      # otool -L of the main binary is authoritative — fail on any dependency
      # outside /usr/lib and /System. SPM binaryTarget frameworks get copied
      # into Frameworks/ even when static (ONNX Runtime's iOS slice is a static
      # ar archive); unreferenced copies are dead weight — strip and log.
      - name: Verify app links no external frameworks + strip dead Frameworks/ copies (LiveContainer requirement)
        if: success()
        run: |
          APP=$(find build/PitchNotesIOS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)
          echo "--- .app overview ---"
          du -sh "$APP"
          ls "$APP"
          BIN="$APP/PitchNotes"
          echo "--- otool -L (system deps only is OK) ---"
          otool -L "$BIN"
          DEPS=$(otool -L "$BIN" | tail -n +2 | grep -vE '^[[:space:]]*/usr/lib/|^[[:space:]]*/System/' || true)
          if [ -n "$DEPS" ]; then
            echo "$DEPS"
            echo "::error::App binary references non-system frameworks/dylibs (see above) — LiveContainer will crash on launch (dyld Library not loaded). All SPM deps must link statically."
            exit 1
          fi
          if [ -d "$APP/Frameworks" ]; then
            echo "--- Frameworks/ contents ---"; ls -la "$APP/Frameworks"
            shopt -s nullglob
            for FW in "$APP/Frameworks"/*; do
              NAME=$(basename "$FW")
              if [ -d "$FW" ] && [[ "$NAME" == *.framework ]]; then
                MACHO="$FW/${NAME%.framework}"
              else
                MACHO="$FW"
              fi
              if [ -f "$MACHO" ]; then
                echo "--- $NAME: file(1) ---"; file "$MACHO"
                echo "--- $NAME: otool -L ---"; otool -L "$MACHO" || true
              fi
              echo "Stripping unreferenced $NAME from Frameworks/ (no load command points at it)"
              rm -rf "$FW"
            done
            rmdir "$APP/Frameworks" 2>/dev/null || true
          fi
          echo "OK: only system dependencies; Frameworks/ empty or removed"

      - name: Show archive failure summary
        if: failure()
        run: |
          grep -E "error:|fatal error|Assertion|Undefined symbol|Testing failed" archive.log \
            | grep -vE "warning:" \
            | tail -n 40 > build-summary.txt || true
          echo "----- BUILD FAILURE SUMMARY (last 40 matching lines) -----"
          cat build-summary.txt
          echo "-----------------------------------------------------------"
          if [ -s build-summary.txt ]; then
            python3 -c "import pathlib; t = pathlib.Path('build-summary.txt').read_text()[:5500]; print('::error title=App build failure::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          fi

      - name: Verify embedded version
        run: |
          APP_PATH="$(find build -path '*Products/Applications/*.app' -maxdepth 6 | head -n 1)"
          test -n "$APP_PATH" || { echo "::error::archived .app not found"; exit 1; }
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" 2>/dev/null || echo "")
          echo "Archived CFBundleShortVersionString: '$VERSION'"
          test -n "$VERSION" && test "$VERSION" != "1.0" || {
            echo "::error::archived Info.plist has no real version (got '$VERSION') — CFBundleShortVersionString is missing from the generated Info.plist"
            exit 1
          }

      - name: Verify background modes
        run: |
          # `audio` must be present and EXACT (background stem playback, J-203);
          # any second mode (fetch, voip, location, processing) is review-bait
          # and unused in v1. BGProcessingTask "quality mode" (§8) needs a
          # documented Leto ruling before it touches this list.
          APP_PATH="$(find build -path '*Products/Applications/*.app' -maxdepth 6 | head -n 1)"
          test -n "$APP_PATH" || { echo "::error::archived .app not found"; exit 1; }
          MODES=$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP_PATH/Info.plist" 2>/dev/null | grep -vE '[{}]' | grep -E '^[[:space:]]*[^[:space:]]' | tr -d ' \t' | tr '\n' ',' | sed 's/,$//')
          echo "Archived UIBackgroundModes: $MODES"
          test "$MODES" = "audio" || {
            echo "::error::UIBackgroundModes must be exactly [audio] (got: $MODES)."
            exit 1
          }

      - name: Package unsigned IPA
        if: success()
        run: ./Scripts/package-ipa.sh build/PitchNotesIOS.xcarchive

      # L-202: sizes logged every run + §8 guard. Weights NEVER ship in the IPA
      # (runtime download + SHA256 verify per manifest) — a >200 MB IPA means a
      # model got embedded by accident. Real M1/M2 IPAs are O(tens of MB).
      - name: IPA size check (L-202 — §8 core budget guard)
        if: success()
        run: |
          IPA_MB=$(du -sm dist/PitchNotesIOS.ipa | cut -f1)
          APP_PATH="$(find build -path '*Products/Applications/*.app' -maxdepth 6 | head -n 1)"
          APP_MB=$(du -sm "$APP_PATH" | cut -f1)
          echo "IPA size: ${IPA_MB} MB; app bundle: ${APP_MB} MB"
          echo "ipa_size_mb=${IPA_MB}" >> "$GITHUB_STEP_SUMMARY"
          echo "app_bundle_mb=${APP_MB}" >> "$GITHUB_STEP_SUMMARY"
          test "$IPA_MB" -lt 200 || {
            echo "::error::IPA ${IPA_MB} MB exceeds the 200 MB §8 core guard — weights must download at runtime, never ship"
            exit 1
          }

      # L-302 (M3): the §8 "core bundle < 200 MB" guard done PROPERLY, plus
      # the explicit ORT contribution.
      #
      # WHY A SECOND CHECK: L-202's check measures the IPA, and the IPA carries
      # NO weights (they download at runtime) — so the IPA number alone
      # UNDERSTATES the real on-device footprint. What §8 budgets is a BUNDLE:
      # the app + the model set it will hold. So the guard is app + core models
      # < 200 MB, computed from the manifest's pinned sizes.
      # D-39 §2: the trimmed-ORT route may only be reconsidered if the size
      # check shows ORT is the blocker — so the ORT footprint is measured and
      # reported explicitly (the SPM checkout is an UPPER BOUND: it holds
      # slices that are not linked; ORT is linked STATICALLY into the binary).
      - name: Core-bundle budget + ORT contribution (L-302 — §8 guard, D-39 §2)
        if: success()
        run: |
          APP_PATH="$(find build -path '*Products/Applications/*.app' -maxdepth 6 | head -n 1)"
          test -n "$APP_PATH" || { echo "::error::archived .app not found"; exit 1; }
          APP_MB=$(du -sm "$APP_PATH" | cut -f1)
          BIN_PATH="$APP_PATH/PitchNotes"
          BIN_MB=0
          if [ -f "$BIN_PATH" ]; then BIN_MB=$(du -sm "$BIN_PATH" | cut -f1); fi
          ORT_DIR=$(find build/DerivedData/SourcePackages/checkouts -maxdepth 1 -type d -name 'onnxruntime*' 2>/dev/null | head -n 1 || true)
          ORT_MB=0
          if [ -n "$ORT_DIR" ]; then ORT_MB=$(du -sm "$ORT_DIR" | cut -f1); fi
          echo "--- ORT static footprint ---"
          if [ -n "$ORT_DIR" ]; then
            echo "ORT SPM checkout (UPPER BOUND — includes slices that are NOT linked): ${ORT_MB} MB — ${ORT_DIR}"
            find "$ORT_DIR" -type f -name '*.a' -exec du -km {} + 2>/dev/null | sort -rn | head -n 5 || true
          else
            echo "ORT SPM checkout not found under SourcePackages/checkouts (unexpected — project.yml pins the ORT mirror)"
          fi
          echo "app binary (contains the statically-linked ORT): ${BIN_MB} MB"
          # The core model set per AGENTS §8. NanoPitch is NOT in it: D-17
          # rejected NanoPitch (GTSinger NC training data), so it is never shipped.
          EVAL=$(python3 -I - <<'PY'
          import json
          core = ("swiftf0", "htdemucs", "basic-pitch", "silero-vad")
          d = json.load(open("Models/manifest.json"))
          by = {m["name"]: m for m in d["models"]}
          total = 0
          missing = []
          for name in core:
              m = by.get(name)
              if m is None:
                  missing.append(name)
              else:
                  total += int(m["size"])
          print(f"TOTAL_MB={total // (1024 * 1024)}")
          print(f"MISSING={','.join(missing)}")
          for name in core:
              m = by.get(name)
              if m is not None:
                  print(f"MODEL {name} {m['size'] / 1024 / 1024:.2f}")
          PY
          )
          TOTAL_MB=$(printf '%s\n' "$EVAL" | grep '^TOTAL_MB=' | cut -d= -f2)
          MISSING=$(printf '%s\n' "$EVAL" | grep '^MISSING=' | cut -d= -f2)
          printf '%s\n' "$EVAL" | grep '^MODEL ' || true
          if [ -n "$MISSING" ]; then
            echo "::warning::core model entries NOT in Models/manifest.json on this branch: ${MISSING} — the projected core footprint below UNDERSTATES the real one (Models/** is PAUL's lane, AGENTS §12)."
          fi
          PROJECTED=$((APP_MB + TOTAL_MB))
          echo "app bundle: ${APP_MB} MB; core model set (runtime download, never in the IPA): ${TOTAL_MB} MB; projected core footprint: ${PROJECTED} MB"
          {
            echo "### Core-bundle budget (L-302)"
            echo ""
            echo "- app bundle: ${APP_MB} MB"
            echo "- app binary (statically-linked ORT inside): ${BIN_MB} MB"
            echo "- ORT SPM checkout (UPPER BOUND, incl. unlinked slices): ${ORT_MB} MB"
            echo "- core model set (downloaded at runtime, never shipped): ${TOTAL_MB} MB"
            echo "- **projected core footprint: ${PROJECTED} MB** (§8 guard: < 200 MB)"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$PROJECTED" -lt 200 || {
            echo "::error::projected core footprint ${PROJECTED} MB (app ${APP_MB} MB + core models ${TOTAL_MB} MB) exceeds the 200 MB §8 core guard"
            exit 1
          }
          echo "OK: projected core footprint ${PROJECTED} MB < 200 MB (§8)"

      - name: Upload dSYM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dSYMs
          path: build/PitchNotesIOS.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PitchNotesIOS
          path: dist/PitchNotesIOS.ipa
          if-no-files-found: error
          # 90 days (Actions default, explicit): gate evidence URLs are recorded
          # in QUEUE.md rows + LOG and must outlive branch-push churn.
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: archive.log
          if-no-files-found: warn
          retention-days: 14
